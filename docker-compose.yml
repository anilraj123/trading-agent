# LIVE cutover 2026-08-21: trader_v2 IS the trading system, running the full
# real-money account. The v1 equity bot and options_bot services are retired
# (trader/ remains as a shared library that trader_v2 imports). Rollback and
# runbook: CUTOVER.md.
services:
  trader-v2:
    build: .
    container_name: trader-v2
    restart: unless-stopped
    env_file:
      - .env
    command: python -m trader_v2
    environment:
      # Live keys come from .env (ALPACA_API_KEY/SECRET). The explicit live
      # endpoint + V2_REQUIRE_PAPER=false here make going live a deliberate,
      # reviewed act — trader_v2 crashes at startup on any mismatch.
      ALPACA_BASE_URL: https://api.alpaca.markets
      V2_REQUIRE_PAPER: "false"
      V2_CAPITAL_MODE: dynamic
      # 2026-09-02: options OFF until the stock side shows an edge. The option
      # path has never fired live; a first contract could lose 55% of a slot
      # on an analyst with no demonstrated edge. Flip to "true" to re-enable.
      V2_OPT_ENABLED: "false"
      # 2026-09-12, user-approved on backtest evidence (research/README.md):
      # the invalidation exit was selected OFF in 16/16 walk-forward folds
      # across two signal families and both universes; on the biased run it
      # was 315 trades at a 0% win rate. The -8% disaster stop is unchanged
      # and remains the loss rail.
      V2_INVALIDATION_EXIT_ENABLED: "false"
      # De-risk while the strategy has no demonstrated edge. Point-in-time
      # walk-forward puts BOTH families at 1/4 folds positive vs SPY, so full
      # sizing is paying tuition for information we already have. 0.10 of
      # equity per position (~$96 of $961) replaces the equal-weight
      # capital/MAX_POSITIONS slice (~$240) as the binding constraint.
      V2_POSITION_CAP_PCT: "0.10"
      DATA_DIR: /app/data/v2live
      NOTIFY_PROVIDER: ntfy
      NOTIFY_NTFY_TOPIC: ${V2_NTFY_TOPIC:-trading-agent}
      EMAIL_ENABLED: "false"
    volumes:
      # rclone config is used by the nightly host-cron backup, which execs
      # rclone inside this container (backup-data.sh on the droplet).
      - ./rclone-config:/root/.config/rclone
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
